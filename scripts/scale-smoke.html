<!doctype html><html><head><meta charset="utf-8"><title>TASK 001 browser smoke</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden}pre{position:fixed;top:0;left:0;background:#10202ddd;color:white;font:12px monospace;z-index:20;max-width:90%;white-space:pre-wrap;pointer-events:none}</style></head><body><iframe src="/?q=medium"></iframe><pre>Loading…</pre><script type="module">
const out=document.querySelector('pre'), frame=document.querySelector('iframe');
const results=[];
const ok=(name,condition,detail)=>{results.push({name,pass:!!condition,detail});if(!condition)throw Error(name+': '+detail)};
try {
await new Promise(r=>frame.addEventListener('load',r));
const w=frame.contentWindow;
while(!w.game) await new Promise(r=>setTimeout(r,50));
const {world,input}=w.game;
await world.kitDone;
while(!world.crew.captain) await new Promise(r=>setTimeout(r,50));
const THREE=await import('/node_modules/three/build/three.module.js');
const {coastDistance,pierPush}=await import('/src/ship-collision.js');
const {PLAYER_SHIP}=await import('/src/ship-config.js');
const {PIER_LENGTH,PIER_WIDTH}=await import('/src/island.js');
const {terrainClearance}=await import('/src/island-shape.js');
w.document.getElementById('go').click(); input.throttle=0;
world.renderer.setAnimationLoop(null); world.resetProgress();
world.atmo.auto=false; world.atmo.setTime(13); world.atmo.setWeather('clear');
const p=world.player, u=p.mesh.userData;
const tick=(n=120,throttle=0)=>{for(let i=0;i<n;i++)world.update(1/60,{throttle,rudder:0})};
const deck=u.navigation.surfaces.find(s=>s.kind==='deck').bounds;
const allIslands=[...world.isles,...world.scenery];
ok('six distinct V3 islands',allIslands.length===6&&new Set(allIslands.map(i=>i.userData.kit)).size===6,allIslands.map(i=>i.userData.kit));
ok('physical shore fields installed',allIslands.every(i=>i.userData.terrain?.field.length===128*128));
ok('sea uses physical shore atlas',world.sea.uniforms.uCoastAtlas.value.image.width===8*128&&world.sea.uniforms.uCoastGrid.value.slice(0,6).every(v=>v.z>0));
ok('player hull and model',u.length===PLAYER_SHIP.length&&u.navigation.source===PLAYER_SHIP.model,{length:u.length,width:u.width,deck});
ok('crew unscaled',world.crew.captain.userData.height===1.75,world.crew.captain.position.toArray());
ok('captain at helm anchor',world.crew.captain.position.toArray().every((n,i)=>Math.abs(n-u.navigation.anchors.captain[i])<1e-5),world.crew.captain.position.toArray());
for(const [side,guns] of Object.entries(u.muzzles)) {
ok('four guns '+side,guns.length===4,guns.length);
for(const m of guns)ok('gun outside hull '+side,Math.abs(m.position.x)>u.width/2,m.position.toArray());
}
for(const isl of world.isles)for(const reverse of [false,true]) {
const b=isl.userData.pier;
p.pos.copy(b.berth);p.heading=b.heading+(reverse?Math.PI:0);p.speed=p.yaw=p.helm=p.throttle=0;
tick(); const dist=Math.hypot(p.pos.x-b.berth.x,p.pos.z-b.berth.z);
ok('berth '+isl.userData.def.name+(reverse?' reverse':''),dist<1e-5&&world.dockState()?.ready,{dist,dock:world.dockState()?.ready});
world.moor(isl);
}
// Geometry regression, isolated from the separately checked impact damage.
const wasImmortal=world.immortal;world.immortal=true;
for(const isl of [...world.isles,...world.scenery]) {
const shore=isl.userData.block||isl.userData.shore+3;
p.pos.copy(isl.position).add(new THREE.Vector3(0,0,shore+u.length)); p.heading=0;p.speed=14;p.yaw=p.helm=0;
tick(240,1);
const clearance=isl.userData.terrain ? terrainClearance(p.pos,p.heading,u.metrics.coast,isl).distance : coastDistance(p.pos,p.heading,u.metrics.coast.reach,isl.position).distance-shore-u.metrics.coast.radius;
ok('coast '+isl.position.x+','+isl.position.z,clearance>=-1e-5,clearance);
}
world.immortal=wasImmortal;
for(const isl of world.isles){
const b=isl.userData.pier;
p.pos.copy(b.berth).addScaledVector(b.side,-1);p.heading=b.heading;p.speed=p.yaw=p.helm=0;
tick(); const push=pierPush(p.pos,p.heading,u,b,b.length??PIER_LENGTH,PIER_WIDTH);
ok('pier '+isl.userData.def.name,!push,push);
}
world.teleport(new THREE.Vector3(0,0,0),0);tick();
let shots=0;const shoot=world.fx.shoot.bind(world.fx);world.fx.shoot=(...a)=>{shots++;return shoot(...a)};
world.fire('left');world.fire('right');tick(60);
ok('eight broadside shots',shots===8,shots);
const ballAt=(ship,local,owner)=>({owner,m:{position:ship.mesh.localToWorld(new THREE.Vector3(...local))}});
ok('hit in scaled hull',world.hits(ballAt(p,[0,3,0],world.boss),p));
ok('miss above hull',!world.hits(ballAt(p,[0,u.metrics.hit.maxY+1,0],world.boss),p));
const hp=p.hp;world.onBall(ballAt(p,[0,1,0],world.boss));ok('player damage',p.hp===hp-5,p.hp);
world.teleport(world.boss.pos,65);world.startBattle();tick(120);
ok('battle active and camera finite',world.state==='battle'&&world.camera.position.toArray().every(Number.isFinite),world.camera.position.toArray());
const bossHp=world.boss.hp;world.onBall(ballAt(world.boss,[0,1,0],p));ok('boss damage',world.boss.hp===bossHp-6,world.boss.hp);
world.fx.clearBalls();world.queue=[];world.state='sail';world.ui.battleHud(null);p.hp=p.maxHp;
world.teleportBerth(world.isles[0],0);tick();
w.game.land();ok('landing starts match',w.game.mode==='match'&&w.game.match.active,w.game.mode);
// Leave via the real UI so the smoke check does not write victory progress.
w.document.getElementById('leave').click();ok('return to sea',w.game.mode==='sea',w.game.mode);
world.teleport(new THREE.Vector3(0,0,0),0);world.camYaw=-.85;world.camPitch=.35;tick(240);
world.renderer.info.autoReset=false;world.renderer.info.reset();world.render();
const stats={calls:world.renderer.info.render.calls,triangles:world.renderer.info.render.triangles,geometries:world.renderer.info.memory.geometries,textures:world.renderer.info.memory.textures};
out.textContent='PASS '+results.length+' browser checks | '+JSON.stringify(stats);
document.body.dataset.result=JSON.stringify({results,stats});
w.addEventListener('resize',()=>requestAnimationFrame(()=>{world.updateCamera(1);world.render()}));
}catch(e){out.textContent='FAIL '+e.stack;document.body.dataset.result=JSON.stringify({results,error:e.stack});}
</script></body></html>
